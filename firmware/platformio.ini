; NETH3T (CYD games build) - ESP32-2432S028R ("Cheap Yellow Display")
; Build/flash from VS Code with the PlatformIO IDE extension, or `pio run -t upload`.

[platformio]
default_envs = cyd

[env]
; Pinned to Arduino-ESP32 core 2.0.x (platform 6.9.0): the combination TFT_eSPI is happiest with.
platform = espressif32@6.9.0
framework = arduino
board = esp32dev
; default.csv has two app slots, which OTA updates need.
board_build.partitions = default.csv
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    ; The registry copy is an old snapshot without begin(SPIClass&); pin the v1.4 release (no git needed).
    XPT2046_Touchscreen=https://github.com/PaulStoffregen/XPT2046_Touchscreen/archive/refs/tags/v1.4.zip
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -Os
    -DCORE_DEBUG_LEVEL=0
    ; ---- TFT_eSPI configured here so you never edit the library's User_Setup.h ----
    -DUSER_SETUP_LOADED=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1

; Most boards (single micro-USB port): ILI9341 panel.
[env:cyd]
build_flags =
    ${env.build_flags}
    -DILI9341_2_DRIVER=1

; Boards with BOTH micro-USB and USB-C ports usually use an ST7789 panel instead.
; If the screen is blank/garbled or the colours are inverted on `cyd`, try this env.
[env:cyd_st7789]
build_flags =
    ${env.build_flags}
    -DST7789_DRIVER=1
    -DTFT_INVERSION_ON=1

; Wireless upload once the first USB flash is done and the CYD is on your WiFi.
; Usage: pio run -e cyd_ota -t upload
[env:cyd_ota]
extends = env:cyd
upload_protocol = espota
upload_port = neth3t.local
upload_flags =
    --auth=cyd-games
